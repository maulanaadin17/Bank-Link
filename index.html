<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Dashboard Spreadsheet</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #eef1f4;
}

/* Layout */
.dashboard {
  display: flex;
  min-height: 100vh;
}

/* Sidebar */
.sidebar {
  width: 260px;
  background: #1f2937;
  color: #fff;
  padding: 20px;
}

.sidebar h2 {
  font-size: 18px;
  margin-bottom: 20px;
}

.sidebar label {
  font-size: 12px;
  margin-top: 10px;
  display: block;
}

.sidebar input,
.sidebar select,
.sidebar button {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  border-radius: 6px;
  border: none;
}

.sidebar button {
  background: #3b82f6;
  color: #fff;
  margin-top: 15px;
  cursor: pointer;
}

.sidebar button:hover {
  background: #2563eb;
}

/* Content */
.content {
  flex: 1;
  padding: 25px;
}

.header {
  font-size: 20px;
  margin-bottom: 20px;
}

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 15px;
}

.card {
  background: #fff;
  padding: 15px;
  border-radius: 10px;
  box-shadow: 0 4px 8px rgba(0,0,0,0.05);
}

.card h3 {
  margin: 0 0 5px;
  font-size: 16px;
}

.card small {
  color: #555;
}
</style>
</head>

<body>

<div class="dashboard">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <h2>🔍 Filter Data</h2>

    <label>Subjek</label>
    <input type="text" id="searchSubjek" placeholder="Cari subjek...">

    <label>Bulan</label>
    <select id="filterBulan">
      <option value="">Semua Bulan</option>
    </select>

    <label>Kategori</label>
    <select id="filterKategori">
      <option value="">Semua Kategori</option>
    </select>

    <button onclick="resetFilter()">Reset</button>
  </div>

  <!-- CONTENT -->
  <div class="content">
    <div class="header">📊 Hasil Data</div>
    <div id="results" class="cards">Loading...</div>
  </div>

</div>


<script>
let allData = [];

fetch("data.json")
  .then(res => res.json())
  .then(data => {
    allData = data;
    initFilters(data);
    render(data);
  });

function initFilters(data) {
  console.log("INIT FILTER", data);
}

function render(data) {
  const el = document.getElementById("results");
  el.innerHTML = "";

  data.forEach(d => {
    el.innerHTML += `
      <div>
        <b>${d.subjek}</b> - ${d.bulan}
      </div>
    `;
  });
}
</script>





</body>
</html>
